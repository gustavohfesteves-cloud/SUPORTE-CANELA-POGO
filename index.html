<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Suprimentos - Treinadores</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('indexfundo.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Camada de vidro para suavizar o fundo */
        .glass-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .header-title {
            color: #ffcb05;
            text-shadow: 3px 3px 0 #3b4cca, -1px -1px 0 #3b4cca, 1px -1px 0 #3b4cca, -1px 1px 0 #3b4cca, 1px 1px 0 #3b4cca;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            z-index: 10;
            text-align: center;
            padding: 0 15px;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        /* MOTOR DE DESLIZAMENTO NATIVO (SCROLL SNAP) */
        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 20px;
            padding: 20px 60px; /* Espaço para as setas não cobrirem os cards */
            scroll-behavior: smooth;
            width: 100%;
            box-sizing: border-box;
            -ms-overflow-style: none;  /* Ocultar barra no IE/Edge */
            scrollbar-width: none;  /* Ocultar barra no Firefox */
        }
        
        /* Ocultar barra de rolagem no Chrome/Safari/Opera */
        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .card {
            scroll-snap-align: center; /* Trava o card no centro da tela ao deslizar */
            flex: 0 0 260px; /* Largura fixa do card */
            height: 380px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: 4px solid #ffcb05;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 0 15px rgba(255, 203, 5, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            text-decoration: none;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card-icon {
            width: 110px;
            height: 110px;
            background-color: #f8f8f8;
            border-radius: 50%;
            border: 4px dashed #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .card-title {
            color: #3b4cca;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
        }

        .card-btn {
            background-color: #ff0000;
            color: #fff;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            border: 2px solid #cc0000;
            transition: 0.2s;
            width: 85%;
        }

        .card:hover .card-btn {
            background-color: #ff3333;
            transform: scale(1.05);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-color: #ffcb05;
            color: #3b4cca;
            border: 3px solid #3b4cca;
            border-radius: 50%;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .nav-btn:active {
            transform: translateY(-50%) scale(0.9);
        }

        .nav-left { left: 10px; }
        .nav-right { right: 10px; }

        @media (max-width: 480px) {
            .card { flex: 0 0 240px; height: 350px; }
            .nav-left { left: 5px; width: 45px; height: 45px; }
            .nav-right { right: 5px; width: 45px; height: 45px; }
            .carousel-track { padding: 20px 50px; }
        }
    </style>
</head>
<body>

    <div class="glass-overlay"></div>

    <h1 class="header-title">Suprimentos Táticos</h1>

    <div class="carousel-container">
        <button class="nav-btn nav-left" onclick="moverCarrossel(-1)">❮</button>
        
        <div class="carousel-track" id="track">
            <!-- 1. Itens -->
            <a href="itens.html" class="card">
                <div class="card-icon">🎒</div>
                <div class="card-title">Itens de Apoio</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 2. Promoção do Dia -->
            <a href="promocaododia.html" class="card">
                <div class="card-icon">⚡</div>
                <div class="card-title">Promoção do Dia</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 3. Promoção da Semana -->
            <a href="promocaodasemana.html" class="card">
                <div class="card-icon">🔥</div>
                <div class="card-title">Promoção da Semana</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 4. Pokémons para Reides -->
            <a href="pokemonsparareides.html" class="card">
                <div class="card-icon">🐉</div>
                <div class="card-title">Esquadrão de Reides</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 5. Pacotes -->
            <a href="pacotes.html" class="card">
                <div class="card-icon">🎁</div>
                <div class="card-title">Pacotes Especiais</div>
                <div class="card-btn">Acessar</div>
            </a>

            <!-- 6. Oferta Única: Mewtwo de Armadura -->
            <a href="mewtwodearmadura.html" class="card">
                <div class="card-icon">🛡️</div>
                <div class="card-title">Mewtwo Armadura</div>
                <div class="card-btn">Ver Oferta Tática</div>
            </a>
        </div>

        <button class="nav-btn nav-right" onclick="moverCarrossel(1)">❯</button>
    </div>

    <script>
        function moverCarrossel(direcao) {
            const track = document.getElementById('track');
            // Calcula o tamanho do pulo (largura do card + gap)
            const scrollAmount = direcao * 280; 
            track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
    </script>
</body>
</html>
