<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Suprimentos - Treinadores</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('indexfundo.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Camada de vidro para suavizar o fundo e dar destaque ao carrossel */
        .glass-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .header-title {
            color: #ffcb05;
            text-shadow: 3px 3px 0 #3b4cca, -1px -1px 0 #3b4cca, 1px -1px 0 #3b4cca, -1px 1px 0 #3b4cca, 1px 1px 0 #3b4cca;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            z-index: 10;
            text-align: center;
            padding: 0 15px;
        }

        .carousel-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            z-index: 10;
        }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .card {
            position: absolute;
            width: 260px;
            height: 380px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: 4px solid #ffcb05;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 0 15px rgba(255, 203, 5, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            text-decoration: none;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
            z-index: 5;
        }

        .card.prev {
            opacity: 0.4;
            transform: translateX(-60%) scale(0.8);
            z-index: 4;
        }

        .card.next {
            opacity: 0.4;
            transform: translateX(60%) scale(0.8);
            z-index: 4;
        }

        .card-icon {
            width: 120px;
            height: 120px;
            background-color: #f8f8f8;
            border-radius: 50%;
            border: 4px dashed #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .card-title {
            color: #3b4cca;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
        }

        .card-btn {
            background-color: #ff0000;
            color: #fff;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            border: 2px solid #cc0000;
            transition: 0.2s;
            width: 80%;
        }

        .card:hover .card-btn {
            transform: scale(1.05);
            background-color: #ff3333;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background-color: #ffcb05;
            color: #3b4cca;
            border: 3px solid #3b4cca;
            border-radius: 50%;
            font-size: 30px;
            font-weight: 900;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .nav-btn:active {
            transform: translateY(-50%) scale(0.9);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .nav-left { left: -30px; }
        .nav-right { right: -30px; }

        @media (max-width: 480px) {
            .nav-left { left: -10px; width: 50px; height: 50px; font-size: 24px; }
            .nav-right { right: -10px; width: 50px; height: 50px; font-size: 24px; }
            .card { width: 240px; height: 350px; }
        }
    </style>
</head>
<body>

    <div class="glass-overlay"></div>

    <h1 class="header-title">Suprimentos Táticos</h1>

    <div class="carousel-container">
        <button class="nav-btn nav-left" onclick="moverCarrossel(-1)">❮</button>
        
        <div class="carousel-track" id="track">
            <!-- 1. Itens -->
            <a href="itens.html" class="card active">
                <div class="card-icon">🎒</div>
                <div class="card-title">Itens de Apoio</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 2. Promoção do Dia -->
            <a href="promocaododia.html" class="card next">
                <div class="card-icon">⚡</div>
                <div class="card-title">Promoção do Dia</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 3. Promoção da Semana -->
            <a href="promocaodasemana.html" class="card">
                <div class="card-icon">🔥</div>
                <div class="card-title">Promoção da Semana</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 4. Pokémons para Reides -->
            <a href="pokemonsparareides.html" class="card">
                <div class="card-icon">🐉</div>
                <div class="card-title">Esquadrão de Reides</div>
                <div class="card-btn">Acessar</div>
            </a>
            
            <!-- 5. Pacotes -->
            <a href="pacotes.html" class="card prev">
                <div class="card-icon">🎁</div>
                <div class="card-title">Pacotes Especiais</div>
                <div class="card-btn">Acessar</div>
            </a>
        </div>

        <button class="nav-btn nav-right" onclick="moverCarrossel(1)">❯</button>
    </div>

    <script>
        const quadros = document.querySelectorAll('.card');
        let indexAtual = 0;
        const total = quadros.length;

        function atualizarClasses() {
            quadros.forEach((quadro, index) => {
                quadro.className = 'card'; 
                
                if (index === indexAtual) {
                    quadro.classList.add('active');
                } else if (index === (indexAtual - 1 + total) % total) {
                    quadro.classList.add('prev');
                } else if (index === (indexAtual + 1) % total) {
                    quadro.classList.add('next');
                }
            });
        }

        function moverCarrossel(direcao) {
            indexAtual = (indexAtual + direcao + total) % total;
            atualizarClasses();
        }
        
        atualizarClasses();
    </script>
</body>
</html>
